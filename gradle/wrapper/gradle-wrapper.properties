distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip
networkTimeout=10000
# The checksum is what makes the download trustworthy; `validateDistributionUrl`
# only checks that the address looks like one. Gradle publishes it beside every
# distribution, and the wrapper refuses a file that does not match — so a
# corrupted download or a substituted one stops before any of it runs.
distributionSha256Sum=21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
