name: Screenshot tour

# Takes pictures of the app while it is used, and puts them in the run so
# they can be looked at and downloaded.
#
# The work happens on a virtual machine in the cloud, so it needs no phone
# and no power at home. The pictures are free to download for a public
# repository.

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "The Android version to use (for example 34 or 35)"
        required: false
        default: "34"
      tour_file:
        description: "The tour to walk through (a file in tools/)"
        required: false
        default: "default-tour.txt"
  schedule:
    # Once a week, so the app is looked at now and then even when nothing
    # is changed. The time is in the early morning in the UTC evening.
    - cron: "23 4 * * 1"
  # Deliberately NOT on every push. Pictures are for a person's eyes, and a
  # person looks at a real install on a real phone: running this on every push
  # would only add minutes to each change without telling anyone anything that
  # the tests in build-and-release.yml do not.

permissions:
  contents: read

jobs:
  tour:
    name: Walk through the app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The post step otherwise starts a second Gradle in a fresh daemon
          # just to prune the cache, which measured twenty-eight seconds here.
          cache-cleanup: never

      # The emulator needs to be able to use the processor of the machine.
      # Without this the emulator runs so slowly that it never finishes
      # starting.
      - name: Let the emulator use the processor
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app
        run: |
          ./gradlew --no-daemon assembleDebug \
            -Pmuffy.versionName="tour" \
            -Pmuffy.versionCode=1

      - name: Walk through the app and take the pictures
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The action runs every line of the script in its own shell, so the
          # values for the tour are given through the environment.
          ADB: adb
          SKIP_LAUNCH: "1"
          SHOT_DIR: ${{ github.workspace }}/screenshots
          TOUR_FILE: ${{ github.workspace }}/tools/${{ inputs.tour_file || 'default-tour.txt' }}
          TRACE_FILE: ${{ github.workspace }}/tour-trace.log
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            # The app is put on the emulator and started.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.example.notes/com.example.notes.MainActivity
            sleep 8

            # The tour walks through the app and takes the pictures.
            bash tools/screenshot-tour.sh

            # The pictures are the point of the run, so a step that did not
            # work does not fail the run: what was made is still worth
            # looking at. But a run that made nothing at all is a failure.
            # Every line of this script is run in a shell of its own, so the
            # check is done by a small script of its own.
            bash tools/check-pictures.sh "$SHOT_DIR"

      - name: Put the pictures in the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/*.png
            tour-trace.log
          if-no-files-found: warn
          retention-days: 30

      - name: Show the pictures in the summary
        if: always()
        env:
          # The pictures are not in the repository, so they are linked to the
          # download of the run instead.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The list of the pictures is put in the summary of the run, so
          # they can be seen without downloading anything.
          {
            echo "## The tour of the app"
            echo ""
            echo "The pictures can be downloaded from the run:"
            echo ""
            echo "[Download all the pictures](${RUN_URL})"
            echo ""
            ls -1 screenshots/*.png 2>/dev/null | while IFS= read -r f; do
              [ -e "$f" ] || continue
              echo "- $(basename "$f") ($(du -h "$f" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"
