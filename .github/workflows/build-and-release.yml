name: Build and release

# Three levels of cost, one for each thing a branch is for.
#
# A pull request runs the tests and nothing else: the tests are what answer
# whether a change is good, and that answer is the only one needed before a
# merge. No lint, no release build.
#
# A push to development adds the release build and keeps the APK as an artifact,
# so there is something to install and look at. It does not publish a release
# and it does not run the deep checks.
#
# A push to main is the only thing that publishes: it runs everything, including
# the deep checks, and a release that fails them is never published.
#
# On main the release is built *at the same time* as the tests rather than after
# them. It cannot be published until the tests pass, so the ordering is kept
# where it matters, and about twenty seconds are saved by not waiting for one to
# finish before starting the other.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "The version of the release (for example 1.4)"
        required: true
        type: string

# A second push makes the first run pointless, so the first one is stopped
# immediately, on a branch and on main alike: a run that nobody will read is the
# most expensive thing a run can do, and pushing twice in a minute should not
# cost two full pipelines.
#
# Cancelling a release is safe because the version is worked out from the last
# published release rather than counted, so a skipped run leaves no gap. It is
# made safer by a check before publishing: the job that publishes verifies the
# commit it is publishing is still the head of main, so a run that was
# overtaken while it was assembling can never publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The tests only read the repository. Writing is granted to the one job that
# publishes a release, so a mistake elsewhere cannot change anything on GitHub.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# The settings every job shares. They are written once here and used through
# `uses: ./.github/actions/setup` style repetition is avoided: each job simply
# repeats these three steps, which is cheaper than the indirection and makes
# each job readable on its own.
# ---------------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------------
  # The tests. The only job a pull request runs.
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # How many runners share the suite, set by the repository variable
    # TEST_SHARDS, which holds a list of shard indexes. `[0,1]` by default: the
    # suite is past the point where one runner is the right shape and well past
    # the point where a second one pays for itself.
    #
    # A shard keeps the same tests from run to run, because the split is by a
    # fixed position in a fixed order and never by what changed. That is what
    # lets each shard keep its own configuration-cache entry.
    strategy:
      # The shards are one gate: a wrong answer from any of them is the same
      # answer. Failing fast stops the others instead of letting them run to the
      # end to learn what the first one already knew.
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(vars.TEST_SHARDS || '[0,1]') }}

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the commit being built is needed. A full history would be
          # fetched for nothing, and the repository is not asked to care about
          # its past to decide whether this commit works.
          fetch-depth: 1
          persist-credentials: false

      # This is deliberately the first thing that happens, before Java and
      # Gradle are set up. Deciding costs a second and needs nothing but git and
      # a shell; provisioning costs fifteen. Asking the cheap question first is
      # what lets a change that cannot affect the app finish in seconds instead
      # of paying for a toolchain it will not use.
      #
      # A pull request runs only the tests its own change can have broken; main
      # runs all of them, because main is what ships. That is the difference
      # between a quick answer on a change and a real answer on a release.
      #
      # The selector falls back to everything whenever it cannot tell: a changed
      # file that is on no line of tools/test-map.txt, a change to the build
      # itself, or an empty change. Unknown means full, never nothing.
      - name: Work out which tests this change needs
        id: which
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          TOOLS_DIR: ${{ github.workspace }}/tools
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # `development` and `main` are the tiers that hand something to a
            # person, so they run everything.
            echo "This is a build, so every test runs."
            selection="$(bash "$TOOLS_DIR/changed-tests.sh" --all)"
          else
            # The changes are measured against the branch the pull request is
            # for, which is fetched because a shallow checkout has only one
            # commit of it and no merge base to compare with.
            git fetch --quiet --no-tags --depth=50 origin "$BASE_REF" || true
            selection="$(bash "$TOOLS_DIR/changed-tests.sh" --base "origin/$BASE_REF")"
          fi

          echo "this change concerns: $selection"
          echo "selection=$selection" >> "$GITHUB_OUTPUT"

          case "$selection" in
            NONE)
              echo "verdict=NONE" >> "$GITHUB_OUTPUT"
              echo "::notice::Nothing that could change the app was touched."
              ;;
            *)
              echo "verdict=RUN" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # What this shard has to do, given the two decisions above: the affected
      # classes narrowed to this shard, and nothing at all when the shard has no
      # share of them. The narrowing is what makes an idle runner cost the floor
      # instead of a build.
      - name: Work out what this shard has to do
        id: shard
        if: steps.which.outputs.verdict == 'RUN'
        env:
          SELECTION: ${{ steps.which.outputs.selection }}
          SHARD: ${{ matrix.shard }}
          SHARD_OF: ${{ strategy.job-total }}
        run: |
          picked="$(bash tools/pick-tests.sh \
            --selection "$SELECTION" --shard "$SHARD" --of "$SHARD_OF")"
          if [ "$picked" = "NONE" ]; then
            echo "nothing=yes" >> "$GITHUB_OUTPUT"
            echo "This shard has no share of what changed, so it stops here."
            exit 0
          fi
          {
            echo "nothing=no"
            echo "args<<PICKED"
            printf '%s\n' "$picked"
            echo "PICKED"
          } >> "$GITHUB_OUTPUT"

      # Everything below is provisioning, and all of it is skipped when there is
      # nothing to run: a job that installs a toolchain to do no work is a job
      # that spends a minute to say nothing.
      - name: Set up Java
        if: steps.shard.outputs.nothing == 'no'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # The action keeps Gradle's home, the downloaded dependencies and the
      # build cache between runs. Everything below is about not paying twice for
      # the same thing.
      #
      # `cache-cleanup: never` is the single largest saving in this file: the
      # action's post step otherwise starts a second Gradle (the runner's own,
      # a different version from ours) in a fresh daemon just to tidy the cache,
      # which measured twenty-eight seconds — more than the tests themselves.
      # The price is that entries are never pruned; this project is small, and
      # the enhanced provider the action uses by default deduplicates them.
      #
      # A pull request only reads the cache. It has nothing worth saving that
      # main will not save a moment later, and a write-only run is a run whose
      # post step is wasted work.
      - name: Set up Gradle
        if: steps.shard.outputs.nothing == 'no'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-cleanup: never
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Say what this machine has
        if: steps.shard.outputs.nothing == 'no'
        run: |
          echo "processors: $(nproc)"
          awk '/MemTotal/ {printf "memory: %.1f GB\n", $2/1024/1024}' /proc/meminfo

      # Robolectric downloads the Android runtime it runs against (a jar of well
      # over a hundred megabytes) the first time it needs it, and would
      # otherwise do that again on every run. It keeps them in the local Maven
      # repository, so that directory is what is kept between runs.
      #
      # The key is a fixed name and not a hash of the build file. Hashing the
      # build file looked careful and was worse than useless: every edit to it
      # produced a new key, which means a cache that is never found and a
      # runtime that is downloaded again. What decides which runtime is needed
      # is the version of Robolectric, which changes rarely, so the key is a
      # version raised by hand when that line in build.gradle.kts changes.
      # Caches cannot be overwritten, so raising this number retires a stale one.
      #
      # This one cache was worth about a minute per run on its own.
      - name: Remember the runtime the tests need
        if: steps.shard.outputs.nothing == 'no'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: robolectric-runtime-v1-${{ runner.os }}

      # Deliberately NOT split into shards. Measured on a 58-test suite: the
      # tests take 16s while setting a job up costs 17s, so two shards would each
      # pay the setup in full to halve a little work — slower in wall clock and
      # twice the runners. Sharding pays when the work dwarfs the setup; worth
      # revisiting if the suite ever passes about two minutes.
      #
      # The release lint runs here rather than in the release build, and that is
      # the single biggest remaining saving. Measured, it is seventeen seconds of
      # the release build's forty, and it is needed by `assembleRelease` only
      # because Android says so. This job finishes well before the release job
      # does, so the same check costs nothing here, and the release job skips it
      # (see there). It still gates the release, because publishing waits for
      # this job to pass.
      # Gradle's configuration cache lives in the project's own `.gradle`
      # directory, which a fresh checkout does not have, so it would be paid for
      # and thrown away on every run. Keeping it turns the configuration phase —
      # measured at fifteen seconds, the largest fixed cost in a run — into a
      # restore.
      #
      # The key is the build files and nothing else: the cache describes how the
      # project is put together, not what the sources say, so a change to a
      # Kotlin file reuses it. When the key does miss, Gradle recomputes and
      # stores a new entry; a miss costs what it costs today and never a wrong
      # build.
      - name: Remember how the project is put together
        if: steps.shard.outputs.nothing == 'no'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          # The shard is part of the key, and has to be: a matrix is one job
          # definition, so every shard would otherwise write to the same key and
          # only one entry would survive. The others would restore a cache
          # holding somebody else's entry, miss, and recompute — which measured
          # as both shards reporting a miss on two consecutive runs.
          # An exact match or nothing. There is no `restore-keys` fallback here,
          # and that is the whole safety of this cache.
          #
          # The configuration cache holds references to classes compiled from
          # the build script itself, so an entry made by a different script loads
          # and then fails with `Class 'Build_gradle$4$1' not found` — a red run
          # that looks like a broken build and is really a stale cache. A
          # fallback key would hand over exactly such an entry whenever the real
          # one is missing, which is what happened here.
          #
          # A miss is cheap: the configuration phase is worked out again. A wrong
          # hit costs a build nobody can explain. So a miss is taken every time.
          # The version is part of the key because an action cache entry can
          # never be overwritten once it exists. A bad entry under a key would
          # then be restored forever after, so raising the version is how the
          # cache is cleared when it is wrong.
          key: config-cache-v2-tests-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run the tests
        if: steps.shard.outputs.nothing == 'no'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PICKED: ${{ steps.shard.outputs.args }}
        run: |
          # `--parallel` does nothing with one module and costs nothing; it is
          # here so that the day the app is split into modules, the runners use
          # them without anybody remembering to add it.
          #
          # `$PICKED` is the affected classes narrowed to this shard, as gradle
          # arguments — or empty when the whole suite runs on one shard, which
          # keeps the command line identical to an unfiltered run and its
          # configuration cache valid.
          #
          # Recording is on for a build and off for a pull request. The scenarios
          # run either way: they are tests, and a broken flow must fail the
          # request that broke it. The flag decides only whether the pictures
          # that make the report get written.
          recording=""
          if [ "$EVENT_NAME" != "pull_request" ]; then
            recording="-Pmuffy.shots"
          fi

          # shellcheck disable=SC2086
          ./gradlew --parallel --no-daemon --configuration-cache \
            testDebugUnitTest \
            $PICKED $recording

      # The pictures are drawn by one class, so exactly one shard writes them.
      # The others have nothing to upload, and say so quietly rather than
      # failing a job for being the wrong half of a split.
      # The flat-scaling law, checked on every run rather than remembered.
      #
      # Adding tests must not add wall time in proportion — compilation is shared
      # and a runner is paid for once. This reads the timings the run already
      # wrote and says where that has stopped being true: one class eating the
      # suite, an average that has crept into seconds, a red run wasting minutes
      # on waits, or sharding switched on after it stopped being worth a runner.
      #
      # Advisory, always. A slow suite is still a suite that passed, and a check
      # that blocks on speed only teaches people to skip tests. `always()` so a
      # red run is measured too: being red is exactly when the shape matters.
      - name: Say whether the suite still scales
        if: always() && steps.shard.outputs.nothing == 'no'
        env:
          SHARD_OF_TOTAL: ${{ strategy.job-total }}
        run: |
          python3 tools/scaling-report.py --shards "$SHARD_OF_TOTAL"

      # The scenarios are drawn by one class, so exactly one shard writes them —
      # and only a build draws them at all. A shard that drew nothing says so
      # quietly rather than failing for being the wrong half of a split.
      - name: Put the scenarios in the run
        if: hashFiles('app/build/outputs/scenarios/**/README.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios
          path: app/build/outputs/scenarios/**
          if-no-files-found: error
          retention-days: 7

      # Kept only when something failed, because it is the only thing that
      # explains a failure: the report carries the per-class timings and the
      # stack traces. On a passing run the same lines are in the log, and the
      # upload costs six seconds to store twenty kilobytes.
      #
      # It also carries how long each test class took, which is the honest basis
      # for deciding whether splitting the suite would ever be worth its cost.
      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7


  # -------------------------------------------------------------------------
  # The release checks, on their own runner so that neither of the other two
  # jobs has to carry them.
  #
  # Android attaches lintVitalRelease to assembleRelease whether or not it is
  # asked for, and it is the single slowest check in the build. Run in the test
  # job it made that job the slowest of the three; run in the release job it
  # delayed the APK. On a runner of its own it costs nothing but a machine,
  # because the other two are busy at the same time.
  #
  # It is a gate all the same: publishing waits for this job, so a release that
  # would fail the check is never published.
  # -------------------------------------------------------------------------
  lint:
    name: Deep checks
    # Behind the gate: there is no point linting a build whose tests failed, and
    # the runner is better spent not doing it. The extra waiting is paid once, by
    # a change that was going to be stopped anyway.
    needs: test
    permissions:
      contents: read
    # Main only. Lint reads the whole project and costs sixty seconds doing it,
    # and a pull request cannot afford that as its longest job: it would be the
    # critical path, and the answer a pull request needs is about the tests.
    #
    # The price of moving it here is honest and worth stating: a lint failure is
    # now found after the merge, on the commit that reached main, rather than on
    # the pull request that caused it. It still cannot ship — publishing waits
    # for this job — so the failure is contained to main being red until it is
    # fixed, instead of a bad APK going out.
    #
    # It does not run on a development branch either: that branch exists to hand
    # a build to the person who will look at it, and the checks worth paying for
    # there are the tests.
    if: |
      needs.test.result == 'success'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-cleanup: never
          cache-read-only: true


      - name: Check the release
        # No --configuration-cache, deliberately, and this was measured the hard
        # way: the first run stores an entry and passes, and the next one reports
        # "Reusing configuration cache." and then dies inside
        # com.android.tools.lint.Main with UastEnvironment and a
        # LintClassLoaderBuildService that cannot be stopped. Lint's UAST
        # machinery does not survive being restored.
        #
        # It costs nothing to give up here: this job runs only on main, where the
        # release build is the longer of the two, so the fifteen seconds the cache
        # would save were never on the critical path.
        run: ./gradlew --parallel --no-daemon --no-configuration-cache lintVitalRelease

  # -------------------------------------------------------------------------
  # The release, built while the tests are still running. Only ever on main.
  # -------------------------------------------------------------------------
  build-release:
    name: Build the release
    # Behind the gate, and this is the whole point of the gate: a build whose
    # tests failed is not handed to anybody, not even for development. The
    # waiting costs the length of the tests and buys never shipping something
    # broken — which is the same reason the gate is the tier that must be fast.
    needs: test
    if: |
      needs.test.result == 'success'
      && github.event_name != 'pull_request' 
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # It only reads the repository and writes the key from a secret. It does not
    # publish, so it never needs to write anything to GitHub.
    permissions:
      contents: read

    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      changed: ${{ steps.decision.outputs.changed }}

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: this one and the one before it, because the question
          # below is "what did this change" and that needs something to compare
          # against. Everywhere else one commit is enough.
          fetch-depth: 2
          persist-credentials: false

      # Asked first, before Java and Gradle are set up, for the same reason the
      # test job asks it first: deciding costs a second and provisioning costs
      # fifteen.
      #
      # A change that cannot reach the app cannot change the APK, so building one
      # would publish a release that is byte for byte the last release with a new
      # number on it — a version spent to say nothing.
      - name: Did the app change
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          TOOLS_DIR: ${{ github.workspace }}/tools
        run: |
          # A release is built for what changed, so this is answered against the
          # commit before this one. A run started by hand is an explicit request
          # for a release and is never skipped.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "Started by hand, so a release is made."
            exit 0
          fi

          verdict="$(bash "$TOOLS_DIR/changed-tests.sh" --base HEAD~1)"
          if [ "$verdict" = "NONE" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Nothing in the app changed, so no APK is built and no version is spent."
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "The app changed, so a release is built."
          fi


      - name: Set up Java
        if: steps.decision.outputs.changed == 'yes'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Read-only here: this job builds and hands the APK on. Whatever is worth
      # remembering about the build has already been remembered by the test job,
      # so there is nothing to add and no reason to spend time writing.
      - name: Set up Gradle
        if: steps.decision.outputs.changed == 'yes'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-cleanup: never
          cache-read-only: true

      - name: Put the signing key in place
        if: steps.decision.outputs.changed == 'yes'
        env:
          MUFFY_KEYSTORE_BASE64: ${{ secrets.MUFFY_KEYSTORE_BASE64 }}
        run: |
          # The build reads the key from the environment, so nothing has to be
          # written to disk that is not needed.
          if [ -z "$MUFFY_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key found, the release will be unsigned."
          fi

      - name: Work out the version
        if: steps.decision.outputs.changed == 'yes'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The values are handed to the script through the environment, so that
          # nothing a person typed is ever pasted into the script.
          EVENT_NAME: ${{ github.event_name }}
          CHOSEN_VERSION: ${{ inputs.version_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # The name is for people to read. A release made by hand may be named
          # anything at all, so it is taken as given and only checked for
          # characters that would be unsafe in a tag or a shell word.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${CHOSEN_VERSION:-}" ]; then
            version_name="$CHOSEN_VERSION"
          else
            # One more than the largest number ever released, so the numbers
            # only ever go up even if a release was named out of order.
            highest="$(gh release list --repo "$REPOSITORY" --limit 100 \
              --json tagName \
              --jq '[.[] | .tagName | sub("^v";"") | select(test("^[0-9]+$")) | tonumber] | max // 0')"
            version_name="$(( ${highest:-0} + 1 ))"
          fi

          case "$version_name" in
            ''|*[!A-Za-z0-9._-]*)
              echo "The version name may only hold letters, digits, dots and dashes."
              exit 1
              ;;
          esac

          # The version code is what Android compares to decide whether an APK is
          # newer than the one installed, so it must be a number that only goes up.
          #
          # It comes from the clock rather than from the name, and that separation
          # is the whole point: a name is free-form and may go backwards, and if
          # the code were derived from it then a hand-made release called 5 would
          # be treated as older than release 46 and could not be installed over it.
          # Seconds since the epoch cannot go backwards and needs no bookkeeping.
          #
          # It does have a horizon: Android holds a version code in a signed
          # 32-bit integer, so the epoch seconds run out in 2038. If the build
          # ever runs past that, fall back to the run number, which is the
          # other integer GitHub guarantees to increase.
          version_code="$(date +%s)"
          if [ "$version_code" -gt 2147483647 ]; then
            version_code="$(( RUN_NUMBER + 1500000000 ))"
          fi

          echo "name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "The version is ${version_name} (code ${version_code})."

      # `-x lintVitalRelease` is not a check being dropped: Android attaches it
      # to `assembleRelease`, and it is the same analysis the test job already
      # runs on its own runner. Running it twice would add a minute here and
      # change nothing, because the release is not published unless that job
      # passed first.
      - name: Build the release
        if: steps.decision.outputs.changed == 'yes'
        env:
          MUFFY_KEYSTORE_BASE64: ${{ secrets.MUFFY_KEYSTORE_BASE64 }}
          MUFFY_KEYSTORE_PASSWORD: ${{ secrets.MUFFY_KEYSTORE_PASSWORD }}
          MUFFY_KEY_ALIAS: ${{ secrets.MUFFY_KEY_ALIAS }}
          MUFFY_KEY_PASSWORD: ${{ secrets.MUFFY_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # --no-configuration-cache, deliberately: this invocation carries a
          # version code and name that differ on every release, so the entry could
          # never be reused and storing it would be a cost with no payoff. Saying
          # it in the command matters, because the project turns the cache on by
          # default and a comment does not turn it off.
          ./gradlew --parallel --no-daemon --no-configuration-cache assembleRelease \
            -x lintVitalRelease \
            -Pmuffy.versionCode="$VERSION_CODE" \
            -Pmuffy.versionName="$VERSION_NAME"

      - name: Check the signature of the APK
        if: steps.decision.outputs.changed == 'yes'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk

          # The version of the build tools is not written down here. It was, and
          # that is the kind of thing that breaks a year later without warning:
          # the runner image decides which versions exist, and it changes. The
          # newest one present is used instead, which is safe because these two
          # tools read anything they are given, however old.
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          BUILD_TOOLS="${BUILD_TOOLS%/}"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::No Android build tools found under $ANDROID_HOME"
            exit 1
          fi
          echo "checking with $(basename "$BUILD_TOOLS")"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # A release that is not signed cannot be installed, so the build stops
          # here rather than publish something unusable.
          "$BUILD_TOOLS/apksigner" verify "$APK"
          "$BUILD_TOOLS/zipalign" -c 4 "$APK"

      # The bundle the run exists to make: the APK, the list of what changed,
      # and the tour pictures that show the features work. Together they answer
      # "what am I looking at, and does it do what was promised" without
      # anybody reading a log.
      # The APK and the version go to the job that assembles the bundle. This job
      # does not wait for the tests: the bundle is assembled once both are done.
      - name: Hand the APK onward
        if: steps.decision.outputs.changed == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # The bundle: the APK, the list of changes, and the pictures.
  #
  # It waits for the tests and the build, because it carries both their results.
  # Nothing is published from here — publishing waits for the checks as well —
  # but on a development push this artifact is the whole point: something to
  # install, with the pictures and the list of changes beside it.
  # -------------------------------------------------------------------------
  bundle:
    name: Make the bundle
    needs: [test, build-release]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Was there anything to put in it
        id: decision
        env:
          BUILT: ${{ needs.build-release.outputs.changed }}
        run: |
          # A build that skipped because nothing in the app changed has nothing
          # to hand over. Making an empty bundle would be worse than making none.
          if [ "$BUILT" = "no" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "The app did not change, so there is no bundle to make."
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the APK
        if: steps.decision.outputs.changed == 'yes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: apk

      - name: Take the scenarios
        if: steps.decision.outputs.changed == 'yes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scenarios
          path: scenarios

      - name: Write down what changed
        if: steps.decision.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash tools/changes.sh > changes.md
          cat changes.md

      - name: Put the bundle together
        if: steps.decision.outputs.changed == 'yes'
        run: |
          mkdir -p bundle
          cp apk/app-release.apk bundle/
          cp changes.md bundle/
          # The scenarios keep their folders: the report refers to the pictures
          # beside it, so flattening them would break every link.
          cp -r scenarios bundle/scenarios
          # One report, assembled from the scenarios that were actually drawn.
          # It is written for a person: no classes, no timings, no stack traces.
          bash tools/scenario-report.sh bundle/scenarios \
            --out bundle/scenarios/README.md
          ls -la bundle/

      - name: Hand the bundle to the job that publishes it
        if: steps.decision.outputs.changed == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-bundle
          path: |
            bundle/app-release.apk
            bundle/changes.md
            bundle/scenarios/**
          # Seven days: this is the thing a development push is for, and a
          # week is long enough to install and look at it.
          retention-days: 7
          if-no-files-found: error


  # -------------------------------------------------------------------------
  # Publishing, which waits for both. This is where "only a tested release"
  # is enforced: nothing is published unless every test passed.
  # -------------------------------------------------------------------------
  publish:
    name: Publish
    # Only main releases, and only by hand or by a push to main. A development
    # push keeps its APK as an artifact of the run instead: something to install
    # and look at, not something to hand to anybody as a version.
    # Only main releases, and only when the app itself changed. A build that
    # skipped because nothing in the app changed has nothing to publish, and a
    # release is not a thing to make for a typo in a document.
    if: |
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && needs.build-release.outputs.changed != 'no'
    needs: [test, build-release, lint, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # The attestation below signs the provenance of the APK, and signing is
      # what needs to be able to prove who this job is. Both are granted only
      # here; every other job reads.
      id-token: write
      attestations: write
      # Reading the branch head is what the guard above needs to know whether
      # this run has been overtaken. Nothing here starts another workflow.
      actions: read

    steps:
      - name: Take the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-bundle
          path: bundle

      # Before anything is published, say where the file came from. The
      # attestation binds the APK to this commit and this workflow run in a way
      # anybody can check afterwards, which is the difference between "a file
      # called app-release.apk" and "the APK built from this commit". It is free
      # for a public repository.
      - name: Attest that this APK came from this commit
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: bundle/app-release.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION_NAME: ${{ needs.build-release.outputs.version_name }}
        run: |
          # A run that was overtaken while it was assembling must never publish:
          # a newer push has cancelled it, but it could have got this far before
          # the cancellation arrived. Publishing a commit that is no longer the
          # head of main would put an old build behind the newest version number.
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ -n "${GITHUB_SHA:-}" ]; then
            head="$(gh api "repos/${REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null)"
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
              echo "This run was overtaken by a newer commit; nothing is published."
              exit 0
            fi
          fi

          # The release is the last thing that happens, so a failure earlier
          # leaves nothing half-published. If it still cannot be made, the build
          # itself was good and only the publishing failed, which is said plainly.
          # A release that already exists is not a failure: a re-run of the same
          # commit must be allowed to do nothing. Anything else is a failure and
          # is reported as one, because a green run that published nothing is the
          # one outcome that must never happen quietly.
          if gh release view "v${VERSION_NAME}" --repo "$REPOSITORY" > /dev/null 2>&1; then
            echo "Version ${VERSION_NAME} is already released; nothing to publish."
            exit 0
          fi

          # The document points at the pictures beside it; on a release page
          # they are files of the release instead, so the links are aimed at
          # the release's own download addresses before the document becomes
          # the body of the release.
          # The scenario pictures become release assets, which cannot have folders, so
            # each one is flattened to a name that still says which scenario and which
            # half of it. The report's links are aimed at those names.
            BASE_URL="https://github.com/${REPOSITORY}/releases/download/v${VERSION_NAME}"
            assets=()
            if [ -d bundle/scenarios ]; then
              for picture in bundle/scenarios/*/*.png; do
                [ -e "$picture" ] || continue
                scenario="$(basename "$(dirname "$picture")")"
                half="$(basename "$picture")"
                name="scenario-${scenario}-${half}"
                cp "$picture" "$name"
                assets+=("$name")
              done
              # A scenario's own page travels too, named so that the report's
              # links to it can be aimed at a flat file. Without it the index
              # points at folders, which a release does not have.
              for page in bundle/scenarios/*/README.md; do
                [ -e "$page" ] || continue
                scenario="$(basename "$(dirname "$page")")"
                name="scenario-${scenario}-page.md"
                cp "$page" "report/$name"
                assets+=("report/$name")
              done
            fi

            # The report is rewritten to point at those assets, then appended to the
            # body: a release page that lists the changes and then shows the app
            # working, in the words of somebody describing it to a person.
            cp bundle/changes.md release-notes.md
            if [ -f bundle/scenarios/README.md ]; then
              {
                printf '\n\n---\n\n'
                # Two rewrites. The pictures become release assets, which cannot
                # live in folders, so their links are aimed at the flattened
                # names. And the index links point at the scenario folders inside
                # the bundle, which a release page does not have — so there they
                # become bold text, because the same page holds the scenario a
                # little further down.
                sed -E \
                  -e "s#\]\(([^/)]+)/(before|after)\.png\)#](${BASE_URL}/scenario-\1-\2.png)#g" \
                  -e "s#\*\*\[([^]]+)\]\([0-9][^)]*/README\.md\)\*\*#\1#g" \
                  -e "s#\[([^]]+)\]\([0-9][^)]*/README\.md\)#**\1**#g" \
                  bundle/scenarios/README.md
              } >> release-notes.md
            fi

            # The report itself goes on the release as a file, under a name of
            # its own: `gh release create` takes an asset's name from the file, so
            # the file is given the name it should have. It is not the same as the
            # body's copy — this one links to folders, which is what the phone
            # needs, and the body's cannot.
            mkdir -p report
            cp bundle/scenarios/README.md report/scenarios.md

            gh release create "v${VERSION_NAME}" \
              --repo "$REPOSITORY" \
              --title "Muffy Codes ${VERSION_NAME}" \
              --notes-file release-notes.md \
              bundle/app-release.apk \
              "${assets[@]}" \
              report/scenarios.md

