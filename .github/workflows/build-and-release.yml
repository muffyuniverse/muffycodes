name: Build and release

# Three levels of cost, one for each thing a branch is for.
#
# A pull request runs the tests and nothing else: the tests are what answer
# whether a change is good, and that answer is the only one needed before a
# merge. No lint, no release build.
#
# A push to development adds the release build and keeps the APK as an artifact,
# so there is something to install and look at. It does not publish a release
# and it does not run the deep checks.
#
# A push to main is the only thing that publishes: it runs everything, including
# the deep checks, and a release that fails them is never published.
#
# On main the release is built *at the same time* as the tests rather than after
# them. It cannot be published until the tests pass, so the ordering is kept
# where it matters, and about twenty seconds are saved by not waiting for one to
# finish before starting the other.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "The version of the release (for example 1.4)"
        required: true
        type: string

# A second push makes the first run pointless, so the first one is stopped
# immediately, on a branch and on main alike: a run that nobody will read is the
# most expensive thing a run can do, and pushing twice in a minute should not
# cost two full pipelines.
#
# Cancelling a release is safe because the version is worked out from the last
# published release rather than counted, so a skipped run leaves no gap. It is
# made safer by a check before publishing: the job that publishes verifies the
# commit it is publishing is still the head of main, so a run that was
# overtaken while it was assembling can never publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The tests only read the repository. Writing is granted to the one job that
# publishes a release, so a mistake elsewhere cannot change anything on GitHub.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# The settings every job shares. They are written once here and used through
# `uses: ./.github/actions/setup` style repetition is avoided: each job simply
# repeats these three steps, which is cheaper than the indirection and makes
# each job readable on its own.
# ---------------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------------
  # The tests. The only job a pull request runs.
  # -------------------------------------------------------------------------
  test:
    name: Test
    # The image is named, not floated. `ubuntu-latest` has already moved under
    # this pipeline once, and a run that fails because a runner's toolchain
    # changed is a mystery with no commit behind it. Naming it turns that into a
    # reviewed edit, made when there is time to make it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    # How many runners share the suite, set by the repository variable
    # TEST_SHARDS, which holds a list of shard indexes. `[0,1]` by default: the
    # suite is past the point where one runner is the right shape and well past
    # the point where a second one pays for itself.
    #
    # A shard keeps the same tests from run to run, because the split is by a
    # fixed position in a fixed order and never by what changed. That is what
    # lets each shard keep its own configuration-cache entry.
    strategy:
      # The shards are one gate: a wrong answer from any of them is the same
      # answer. Failing fast stops the others instead of letting them run to the
      # end to learn what the first one already knew.
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(vars.TEST_SHARDS || '[0,1]') }}

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the commit being built is needed. A full history would be
          # fetched for nothing, and the repository is not asked to care about
          # its past to decide whether this commit works.
          fetch-depth: 1
          persist-credentials: false

      # This is deliberately the first thing that happens, before Java and
      # Gradle are set up. Deciding costs a second and needs nothing but git and
      # a shell; provisioning costs fifteen. Asking the cheap question first is
      # what lets a change that cannot affect the app finish in seconds instead
      # of paying for a toolchain it will not use.
      #
      # A pull request runs only the tests its own change can have broken; main
      # runs all of them, because main is what ships. That is the difference
      # between a quick answer on a change and a real answer on a release.
      #
      # The selector falls back to everything whenever it cannot tell: a changed
      # file that is on no line of tools/test-map.txt, a change to the build
      # itself, or an empty change. Unknown means full, never nothing.
      - name: Work out which tests this change needs
        id: which
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          TOOLS_DIR: ${{ github.workspace }}/tools
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # `development` and `main` are the tiers that hand something to a
            # person, so they run everything.
            echo "This is a build, so every test runs."
            selection="$(bash "$TOOLS_DIR/changed-tests.sh" --all)"
          else
            # The changes are measured against the branch the pull request is
            # for, which is fetched because a shallow checkout has only one
            # commit of it and no merge base to compare with.
            git fetch --quiet --no-tags --depth=50 origin "$BASE_REF" || true
            selection="$(bash "$TOOLS_DIR/changed-tests.sh" --base "origin/$BASE_REF")"
          fi

          echo "this change concerns: $selection"
          echo "selection=$selection" >> "$GITHUB_OUTPUT"

          case "$selection" in
            NONE)
              echo "verdict=NONE" >> "$GITHUB_OUTPUT"
              echo "::notice::Nothing that could change the app was touched."
              ;;
            *)
              echo "verdict=RUN" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # What this shard has to do, given the two decisions above: the affected
      # classes narrowed to this shard, and nothing at all when the shard has no
      # share of them. The narrowing is what makes an idle runner cost the floor
      # instead of a build.
      - name: Work out what this shard has to do
        id: shard
        if: steps.which.outputs.verdict == 'RUN'
        env:
          SELECTION: ${{ steps.which.outputs.selection }}
          SHARD: ${{ matrix.shard }}
          SHARD_OF: ${{ strategy.job-total }}
        run: |
            # The class names, not gradle arguments. The command line is an input
            # the configuration cache is keyed on, so a selection that changed it
            # made every narrowed run miss the cache and work out the build again
            # — about six seconds of the thirty a narrowed run spends in Gradle.
            # The build reads MUFFY_ONLY_TESTS at execution time instead, where it
            # is not a cache input, and the command line is identical every run.
            classes="$(bash tools/pick-tests.sh \
              --selection "$SELECTION" --shard "$SHARD" --of "$SHARD_OF" --format names)"
            if [ "$classes" = "NONE" ]; then
              echo "nothing=yes" >> "$GITHUB_OUTPUT"
              echo "This shard has no share of what changed, so it stops here."
              exit 0
            fi
            {
              echo "nothing=no"
              echo "classes=$classes"
            } >> "$GITHUB_OUTPUT"

      # Everything below is provisioning, and all of it is skipped when there is
      # nothing to run: a job that installs a toolchain to do no work is a job
      # that spends a minute to say nothing.
      # The workflow checks itself first, because a mistake here is the most
      # expensive kind: it does not fail, it makes something never run. A step
      # whose `if:` reads a misspelled step id is skipped, and the job reports
      # success — so the gate that was supposed to guard the release simply is not
      # there, and nothing says so.
      #
      # It runs only on the first shard, since the answer does not depend on which
      # shard asks, and before Java and Gradle are set up: a broken workflow is a
      # two-second answer instead of a ninety-second one.
      - name: Check the workflow itself
        if: matrix.shard == 0
        run: python3 tools/check-workflow.py

      # The selector is tested against answers that are already known.
      #
      # It once compared two spellings of a class name, matched neither, and let
      # every shard decide it had nothing to do — so the run went green having
      # executed no tests, and nothing anywhere said so. This is the guard: a
      # handful of selections whose correct answers are not in doubt, checked in
      # a few seconds, before anything is built.
      - name: Check that the test selector agrees with itself
        if: matrix.shard == 0
        run: bash tools/pick-tests.sh --self-test

      # The map's own drift, which the selector's self-test cannot see. That test
      # proves the arithmetic — a name reaches exactly one shard — but it reads the
      # same universe the map does, so a class the map forgot is invisible to it.
      # This compares the map against the files: every test class named, every
      # source accounted for, nothing stale.
      #
      # It proves inventory, not coverage. Nothing here can tell whether
      # SyncFeatureTest really exercises ProjectGit.kt — only that neither side has
      # quietly stopped mentioning the other.
      - name: Check that the test map and the tests agree
        if: matrix.shard == 0
        run: python3 tools/check-test-map.py

      # The version code decides whether Android will install a build over the one
      # already on the phone, so the one thing it must do is never go down. Its
      # boundary is a dated switch rather than a date, and a date is hard to test,
      # which is why the arithmetic lives in a script with a self-test instead of
      # in an inline expression here.
      - name: Check that the version code only ever goes up
        if: matrix.shard == 0
        run: bash tools/version-code.sh --self-test

      - name: Set up Java
        if: steps.shard.outputs.nothing == 'no'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # The action keeps Gradle's home, the downloaded dependencies and the
      # build cache between runs. Everything below is about not paying twice for
      # the same thing.
      #
      # `cache-cleanup: never` is the single largest saving in this file: the
      # action's post step otherwise starts a second Gradle (the runner's own,
      # a different version from ours) in a fresh daemon just to tidy the cache,
      # which measured twenty-eight seconds — more than the tests themselves.
      # The price is that entries are never pruned; this project is small, and
      # the enhanced provider the action uses by default deduplicates them.
      #
      # A pull request only reads the cache. It has nothing worth saving that
      # main will not save a moment later, and a write-only run is a run whose
      # post step is wasted work.
      - name: Set up Gradle
        if: steps.shard.outputs.nothing == 'no'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-cleanup: never
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Say what this machine has
        if: steps.shard.outputs.nothing == 'no'
        run: |
          echo "processors: $(nproc)"
          awk '/MemTotal/ {printf "memory: %.1f GB\n", $2/1024/1024}' /proc/meminfo

      # Robolectric downloads the Android runtime it runs against (a jar of well
      # over a hundred megabytes) the first time it needs it, and would
      # otherwise do that again on every run. It keeps them in the local Maven
      # repository, so that directory is what is kept between runs.
      #
      # The key follows the Robolectric version, and nothing else.
      #
      # Hashing the whole build file was tried first and was worse than useless:
      # that file changes on most working days, so every change produced a new key
      # and the cache was never found — the runtime downloaded again each time.
      #
      # The version was then a number raised by hand, which fails the other way
      # and fails silently: after an upgrade the key does not change, so the *old*
      # runtime is restored forever and every run pays for a download it can never
      # cache. That reads as a slow runner, not as a stale key, which is why it
      # would have survived a long time.
      #
      # So the version is read out of the build file at run time. The key changes
      # exactly when the version does, and the step fails loudly if it cannot find
      # it — an empty version would otherwise produce one key shared by every
      # Robolectric version, which is the hand-raised problem with extra steps.
      #
      # This one cache was worth about a minute per run on its own.
      - name: Work out which Android runtime the tests need
        id: robolectric
        if: steps.shard.outputs.nothing == 'no'
        run: |
          version="$(grep -oE 'org\.robolectric:robolectric:[0-9][^"\x27 ]*' \
            app/build.gradle.kts | head -1 | sed 's/.*://')"
          if [ -z "$version" ]; then
            echo "::error::Could not find the Robolectric version in app/build.gradle.kts."
            echo "The runtime cache key depends on it, and an empty key would be shared"
            echo "by every version."
            exit 1
          fi
          echo "robolectric $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Remember the runtime the tests need
        if: steps.shard.outputs.nothing == 'no'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: robolectric-runtime-${{ steps.robolectric.outputs.version }}-${{ runner.os }}

      # Deliberately NOT split into shards. Measured on a 58-test suite: the
      # tests take 16s while setting a job up costs 17s, so two shards would each
      # pay the setup in full to halve a little work — slower in wall clock and
      # twice the runners. Sharding pays when the work dwarfs the setup; worth
      # revisiting if the suite ever passes about two minutes.
      #
      # The release lint runs here rather than in the release build, and that is
      # the single biggest remaining saving. Measured, it is seventeen seconds of
      # the release build's forty, and it is needed by `assembleRelease` only
      # because Android says so. This job finishes well before the release job
      # does, so the same check costs nothing here, and the release job skips it
      # (see there). It still gates the release, because publishing waits for
      # this job to pass.
      # Gradle's configuration cache lives in the project's own `.gradle`
      # directory, which a fresh checkout does not have, so it would be paid for
      # and thrown away on every run. Keeping it turns the configuration phase —
      # measured at fifteen seconds, the largest fixed cost in a run — into a
      # restore.
      #
      # The key is the build files and nothing else: the cache describes how the
      # project is put together, not what the sources say, so a change to a
      # Kotlin file reuses it. When the key does miss, Gradle recomputes and
      # stores a new entry; a miss costs what it costs today and never a wrong
      # build.
      - name: Remember how the project is put together
        if: steps.shard.outputs.nothing == 'no'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          # The shard is part of the key, and has to be: a matrix is one job
          # definition, so every shard would otherwise write to the same key and
          # only one entry would survive. The others would restore a cache
          # holding somebody else's entry, miss, and recompute — which measured
          # as both shards reporting a miss on two consecutive runs.
          # An exact match or nothing. There is no `restore-keys` fallback here,
          # and that is the whole safety of this cache.
          #
          # The configuration cache holds references to classes compiled from
          # the build script itself, so an entry made by a different script loads
          # and then fails with `Class 'Build_gradle$4$1' not found` — a red run
          # that looks like a broken build and is really a stale cache. A
          # fallback key would hand over exactly such an entry whenever the real
          # one is missing, which is what happened here.
          #
          # A miss is cheap: the configuration phase is worked out again. A wrong
          # hit costs a build nobody can explain. So a miss is taken every time.
          # The version is part of the key because an action cache entry can
          # never be overwritten once it exists. A bad entry under a key would
          # then be restored forever after, so raising the version is how the
          # cache is cleared when it is wrong.
          # The event is part of the key, and it has to be. A build of main or
          # development runs with `-Pmuffy.shots` and a pull request does not, so
          # the two make different configuration-cache entries for the same build
          # files. One key shared between them means whichever ran first owns the
          # entry, the other never restores a matching one, and — because cache
          # entries are immutable — it can never save its own either. It would miss
          # forever while the workflow looked entirely correct.
          key: config-cache-v3-tests-${{ matrix.shard }}-${{ runner.os }}-${{ github.event_name }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run the tests
        if: steps.shard.outputs.nothing == 'no'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MUFFY_ONLY_TESTS: ${{ steps.shard.outputs.classes }}
        run: |
          # `--parallel` does nothing with one module and costs nothing; it is
          # here so that the day the app is split into modules, the runners use
          # them without anybody remembering to add it.
          #
          # The selection arrives in MUFFY_ONLY_TESTS and is applied by the
          # build while it runs, not by the command line — see above.
          #
          # Recording is on for a build and off for a pull request. The scenarios
          # run either way: they are tests, and a broken flow must fail the
          # request that broke it. The flag decides only whether the pictures
          # that make the report get written.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            ./gradlew --parallel --no-daemon --configuration-cache \
                --profile testDebugUnitTest -Pmuffy.shots
          else
            ./gradlew --parallel --no-daemon --configuration-cache \
                --profile testDebugUnitTest
          fi

      # The other half of the asking.
      #
      # Every guard before this one is about deciding *what* to run: the selector
      # reads the change, the shard script says whose turn it is, the build applies
      # the list. Nothing looked at what came back. The evidence that tests ran has
      # been Gradle's exit status, which is precisely the thing that was green on
      # the day the selector matched nothing and every shard concluded it was idle.
      #
      # So the result files are read and compared against the classes this shard
      # was asked for. A selected class that produced no test case is a failure, not
      # a quiet line in a report, because that class is the only reason the run
      # exists. Costs well under a second — it is a directory of XML.
      #
      # `if: always()` is deliberate: on a red run this is the step that says which
      # classes did run, and that is the first question anybody asks.
      - name: Check that the tests that ran are the tests that were asked for
        if: always() && steps.shard.outputs.nothing == 'no'
        env:
          MUFFY_ONLY_TESTS: ${{ steps.shard.outputs.classes }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # A run that failed has already failed; read the results to explain it,
          # but do not turn a compilation error into "zero tests ran" as well.
          if [ "$JOB_STATUS" = "failure" ]; then
            python3 tools/check-results.py --expect "" || true
            exit 0
          fi
          python3 tools/check-results.py --expect "$MUFFY_ONLY_TESTS"

      # The pictures are drawn by one class, so exactly one shard writes them.
      # The others have nothing to upload, and say so quietly rather than
      # failing a job for being the wrong half of a split.
      # The flat-scaling law, checked on every run rather than remembered.
      #
      # Adding tests must not add wall time in proportion — compilation is shared
      # and a runner is paid for once. This reads the timings the run already
      # wrote and says where that has stopped being true: one class eating the
      # suite, an average that has crept into seconds, a red run wasting minutes
      # on waits, or sharding switched on after it stopped being worth a runner.
      #
      # Advisory, always. A slow suite is still a suite that passed, and a check
      # that blocks on speed only teaches people to skip tests. `always()` so a
      # red run is measured too: being red is exactly when the shape matters.
      - name: Say whether the suite still scales
        if: always() && steps.shard.outputs.nothing == 'no'
        env:
          SHARD_OF_TOTAL: ${{ strategy.job-total }}
        run: |
          python3 tools/scaling-report.py --shards "$SHARD_OF_TOTAL"

      # The scenarios are drawn by one class, so exactly one shard writes them —
      # and only a build draws them at all. A shard that drew nothing says so
      # quietly rather than failing for being the wrong half of a split.
      # The other half of the same question. The scaling report says whether the
      # tests scale; this says where the job's minutes actually went, and puts
      # compilation next to test execution so that "the suite takes fifty
      # seconds" becomes two numbers that can be argued with separately.
      - name: Say where the test job's time went
        if: always() && steps.shard.outputs.nothing == 'no'
        # No budget here on purpose: what a test costs is the suite's business, and
        # tools/scaling-report.py already holds those thresholds. Two places
        # deciding the same budget would disagree, and the quieter one would win.
        run: python3 tools/build-times.py --results . --top 8 --label test --no-budget

      - name: Put the scenarios in the run
        if: hashFiles('app/build/outputs/scenarios/**/README.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios
          path: app/build/outputs/scenarios/**
          if-no-files-found: error
          retention-days: 7

      # Kept only when something failed, because it is the only thing that
      # explains a failure: the report carries the per-class timings and the
      # stack traces. On a passing run the same lines are in the log, and the
      # upload costs six seconds to store twenty kilobytes.
      #
      # It also carries how long each test class took, which is the honest basis
      # for deciding whether splitting the suite would ever be worth its cost.
      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7


  # -------------------------------------------------------------------------
  # The release checks, on their own runner so that neither of the other two
  # jobs has to carry them.
  #
  # Android attaches lintVitalRelease to assembleRelease whether or not it is
  # asked for, and it is the single slowest check in the build. Run in the test
  # job it made that job the slowest of the three; run in the release job it
  # delayed the APK. On a runner of its own it costs nothing but a machine,
  # because the other two are busy at the same time.
  #
  # It is a gate all the same: publishing waits for this job, so a release that
  # would fail the check is never published.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Lint, in two depths.
  #
  # It was main-only, and on main it ran `lintVitalRelease` — the *fatal* subset
  # that Android attaches to a release build, not the whole analysis. So the two
  # halves of "cheap on development, deep on main" were both missing: development
  # had no lint at all, and main was not running the deep one.
  #
  # Now every push that is not a pull request lints, and which analysis runs
  # depends on where it is:
  #
  #   main             `lintRelease` — every check, on the variant that ships
  #   development      nothing
  #   a pull request   nothing
  #
  # Development was given `lintDebug` on the theory that the test job's debug
  # compile would be reused and the analysis would be nearly free. Measured:
  # **111s**, longer than `lintRelease` on main at 98s. Gradle's cache entries
  # are keyed per job here, so a job cannot restore another job's compile — it
  # compiled debug itself and then analysed it. The theory was wrong and the
  # branch that hands out builds to look at is the wrong place to spend two
  # minutes proving something has never once failed.
  #
  # Lint analyses the whole tree by design, so it is a release gate: main, where
  # the thing being produced is a version rather than something to glance at.
  # -------------------------------------------------------------------------
  lint:
    name: Deep checks
    # Beside the tests rather than after them: a lint pass says nothing about
    # whether the tests will pass, so serialising them put both on the clock for
    # nothing.
    if: |
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits, because the question below is what changed.
          fetch-depth: 2
          persist-credentials: false

      # Asked before the toolchain is set up, for the same reason the test job
      # asks it first: a change that cannot reach the app cannot introduce a
      # finding, and answering costs a second where provisioning costs fifteen.
      #
      # This was missing, and it was costing a full lint on every documentation
      # push to main — ninety seconds to analyse a Kotlin tree that had not moved.
      - name: Did the app change
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          TOOLS_DIR: ${{ github.workspace }}/tools
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(bash "$TOOLS_DIR/push-base.sh" "$BEFORE")"
          verdict="$(bash "$TOOLS_DIR/changed-tests.sh" --base "$base")"
          if [ "$verdict" = "NONE" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Nothing in the app changed, so there is nothing to analyse."
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.decision.outputs.changed == 'yes'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.decision.outputs.changed == 'yes'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-cleanup: never
          cache-read-only: true

      # No --configuration-cache, deliberately, and this was measured the hard
      # way: the first run stores an entry and passes, and the next reports
      # "Reusing configuration cache." and then dies inside
      # com.android.tools.lint.Main with UastEnvironment and a
      # LintClassLoaderBuilderService that cannot be stopped. Lint's UAST
      # machinery does not survive being restored.
      - name: Run the analysis
        if: steps.decision.outputs.changed == 'yes'
        run: |
          # GITHUB_REF_NAME is the branch already; there is nothing to work out.
          if [ "${GITHUB_REF_NAME:-}" = "main" ]; then
            echo "On main: every check, on the variant that ships."
            ./gradlew --parallel --no-daemon --no-configuration-cache lintRelease
          else
            echo "Not main: the same analyzer on debug, which the tests already compiled."
            ./gradlew --parallel --no-daemon --no-configuration-cache lintDebug
          fi

  # -------------------------------------------------------------------------
  # The release, built while the tests are still running. Only ever on main.
  # -------------------------------------------------------------------------
  build-release:
    name: Build the release
    # Beside the tests, not behind them, because the two ask different
    # questions and neither needs the other's answer to begin: a build asks
    # whether the code compiles and an APK comes out, the suite asks whether it
    # behaves. Starting the build late put the whole test run on the critical
    # path for no benefit — measured, the build's clock began at 57-67s, exactly
    # when the tests ended.
    #
    # What that costs is a build paid for on a red run, and it is accepted: it is
    # not the same as shipping, because nothing is handed on until the suite has
    # been asked about — see the check before the APK leaves this job.
    if: |
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # It only reads the repository and writes the key from a secret. It does not
    # publish, so it never needs to write anything to GitHub.
    permissions:
      contents: read

    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      changed: ${{ steps.decision.outputs.changed }}

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: this one and the one before it, because the question
          # below is "what did this change" and that needs something to compare
          # against. Everywhere else one commit is enough.
          fetch-depth: 2
          persist-credentials: false

      # Asked first, before Java and Gradle are set up, for the same reason the
      # test job asks it first: deciding costs a second and provisioning costs
      # fifteen.
      #
      # A change that cannot reach the app cannot change the APK, so building one
      # would publish a release that is byte for byte the last release with a new
      # number on it — a version spent to say nothing.
      - name: Did the app change
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          TOOLS_DIR: ${{ github.workspace }}/tools
        run: |
          # A release is built for what changed, so this is answered against the
          # commit the branch was at before this push — not against the commit
          # before the tip, which is a different question. Asking the wrong one
          # once skipped a release because the last commit of the push happened to
          # be a document. A run started by hand is an explicit request for a
          # release and is never skipped.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "Started by hand, so a release is made."
            exit 0
          fi

          base="$(bash "$TOOLS_DIR/push-base.sh" "$BEFORE")"
          verdict="$(bash "$TOOLS_DIR/changed-tests.sh" --base "$base")"
          if [ "$verdict" = "NONE" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Nothing in the app changed, so no APK is built and no version is spent."
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "The app changed, so a release is built."
          fi


      - name: Set up Java
        if: steps.decision.outputs.changed == 'yes'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Back to read-only, and this time it is measured rather than assumed.
      #
      # The earlier version of this comment claimed that writing release entries
      # would let the next run restore them. Two runs later the count is identical
      # either way — 14 tasks from cache, 31 executed, the same 14 — and the build
      # itself is the same 50 seconds. Writing bought nothing and cost seven
      # seconds at the end of the job, which is what saving a 144MB cache entry
      # takes. The reason is plain in the profile: every expensive release task
      # (compileReleaseKotlin, mergeDexRelease, dexBuilderRelease) is keyed on the
      # sources or the classes built from them, so it can never hit. Only the cheap
      # ones around them can, and those are already in the shared cache.
      - name: Set up Gradle
        if: steps.decision.outputs.changed == 'yes'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-cleanup: never
          cache-read-only: true

      - name: Put the signing key in place
        if: steps.decision.outputs.changed == 'yes'
        env:
          MUFFY_KEYSTORE_BASE64: ${{ secrets.MUFFY_KEYSTORE_BASE64 }}
        run: |
          # The build reads the key from the environment, so nothing has to be
          # written to disk that is not needed.
          if [ -z "$MUFFY_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key found, the release will be unsigned."
          fi

      - name: Work out the version
        if: steps.decision.outputs.changed == 'yes'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The values are handed to the script through the environment, so that
          # nothing a person typed is ever pasted into the script.
          EVENT_NAME: ${{ github.event_name }}
          CHOSEN_VERSION: ${{ inputs.version_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # The name is for people to read. A release made by hand may be named
          # anything at all, so it is taken as given and only checked for
          # characters that would be unsafe in a tag or a shell word.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${CHOSEN_VERSION:-}" ]; then
            version_name="$CHOSEN_VERSION"
          else
            # One more than the largest number ever released, so the numbers
            # only ever go up even if a release was named out of order.
            highest="$(gh release list --repo "$REPOSITORY" --limit 100 \
              --json tagName \
              --jq '[.[] | .tagName | sub("^v";"") | select(test("^[0-9]+$")) | tonumber] | max // 0')"
            version_name="$(( ${highest:-0} + 1 ))"
          fi

          case "$version_name" in
            ''|*[!A-Za-z0-9._-]*)
              echo "The version name may only hold letters, digits, dots and dashes."
              exit 1
              ;;
          esac

          # The version code is what Android compares to decide whether an APK is
          # newer than the one installed, so it must be a number that only goes up.
          #
          # It comes from the clock rather than from the name, and that separation
          # is the whole point: a name is free-form and may go backwards, and if
          # the code were derived from it then a hand-made release called 5 would
          # be treated as older than release 46 and could not be installed over it.
          # Seconds since the epoch cannot go backwards and needs no bookkeeping.
          #
          # It does have a horizon: Android holds a version code in a signed
          # 32-bit integer, so the epoch seconds run out in 2038. If the build
          # ever runs past that, fall back to the run number, which is the
          # other integer GitHub guarantees to increase.
          version_code="$(bash tools/version-code.sh)"
          # The boundary lives in tools/version-code.sh, which has a self-test,
          # because the inline fallback it replaced was not monotonic: it produced
          # a number below the last one the clock had produced, so the first build
          # after the switch would have been treated as older than the build before
          # it and would not have installed — in 2038, with nobody watching.

          echo "name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "The version is ${version_name} (code ${version_code})."

      # `-x lintVitalRelease` is not a check being dropped: Android attaches it
      # to `assembleRelease`, and it is the same analysis the test job already
      # runs on its own runner. Running it twice would add a minute here and
      # change nothing, because the release is not published unless that job
      # passed first.
      - name: Build the release
        if: steps.decision.outputs.changed == 'yes'
        env:
          MUFFY_KEYSTORE_BASE64: ${{ secrets.MUFFY_KEYSTORE_BASE64 }}
          MUFFY_KEYSTORE_PASSWORD: ${{ secrets.MUFFY_KEYSTORE_PASSWORD }}
          MUFFY_KEY_ALIAS: ${{ secrets.MUFFY_KEY_ALIAS }}
          MUFFY_KEY_PASSWORD: ${{ secrets.MUFFY_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # --no-configuration-cache, deliberately: this invocation carries a
          # --profile writes a report of what each task took. It costs a moment and
          # it is the difference between knowing where a minute and a half goes and
          # guessing at it — which is how this job spent thirty seconds caching
          # things it could never read back.
          ./gradlew --parallel --no-daemon --no-configuration-cache --profile assembleRelease \
            -x lintVitalRelease \
            -Pmuffy.versionCode="$VERSION_CODE" \
            -Pmuffy.versionName="$VERSION_NAME"

      # Always, including after a failure: a build that broke is the one whose
      # timing is worth seeing. Advisory, and it cannot fail the job.
      - name: Say where the build's time went
        if: always() && steps.decision.outputs.changed == 'yes'
        run: python3 tools/build-times.py --results . --top 10

      # The gate, moved from 'wait for the tests' to 'ask about them'.
      #
      # GitHub cannot stop a running job because a sibling failed — fail-fast spans
      # a matrix and nothing else — so the build runs optimistically and asks, here,
      # whether the suite that ran beside it passed. If it did not, nothing leaves
      # this job: no artifact, and this job fails. That keeps the rule that matters
      # (a broken app is never handed to anybody) and drops the rule that cost a
      # minute per run (the build may not start until the tests are done).
      #
      # The asking has to be a *wait*, and it has to fail closed. See below.
      - name: Wait for the suite before anything leaves this job
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The APK is signed, aligned and installable, so it must not exist until
          # the suite has finished and passed.
          #
          # This step used to ask once and treat "still running" as permission, on
          # the argument that delivery waits anyway — but the artifact is
          # downloadable the moment it is uploaded, and a run that goes red a
          # minute later does not delete it. Worse, the query threw away the jobs
          # that had no conclusion and then asked whether all the *remaining* ones
          # passed: shard 0 finishing first made the answer "green" while shard 1
          # was still running. With two shards that is the ordinary case.
          #
          # Waiting costs nothing that was not already being paid, because
          # delivery cannot begin until the suite is done. An unreadable answer is
          # now a failure rather than a shrug.
          deadline=$((SECONDS + 1800))
          while :; do
            rows="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.name | startswith("Test"))
                    | "\(.status)\t\(.conclusion // "-")\t\(.name)"' 2>/dev/null)"
            if [ -z "$rows" ]; then
              echo "::error::Could not read the suite's state, so the APK is not handed on."
              exit 1
            fi

            running=0
            failed=""
            total=0
            while IFS=$'\t' read -r status conclusion name; do
              [ -n "$status" ] || continue
              total=$((total + 1))
              if [ "$status" != "completed" ]; then
                running=$((running + 1))
              elif [ "$conclusion" != "success" ]; then
                failed="$failed $name"
              fi
            done <<< "$rows"

            if [ "$total" -eq 0 ]; then
              echo "::error::No test job exists in this run, so there is nothing to trust."
              exit 1
            fi
            if [ -n "$failed" ]; then
              echo "::error::The suite did not pass:${failed}. The APK is not handed on."
              exit 1
            fi
            [ "$running" -eq 0 ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The suite did not finish in time, so the APK is not handed on."
              exit 1
            fi
            echo "$running of $total test jobs are still running; waiting."
            sleep 10
          done
          echo "All $total test jobs passed, so the APK is handed on."

      - name: Check the signature of the APK
        if: steps.decision.outputs.changed == 'yes'
        env:
          EXPECTED_CERT: ${{ vars.EXPECTED_CERT }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk

          # The version of the build tools is not written down here. It was, and
          # that is the kind of thing that breaks a year later without warning:
          # the runner image decides which versions exist, and it changes. The
          # newest one present is used instead, which is safe because these two
          # tools read anything they are given, however old.
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          BUILD_TOOLS="${BUILD_TOOLS%/}"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::No Android build tools found under $ANDROID_HOME"
            exit 1
          fi
          echo "checking with $(basename "$BUILD_TOOLS")"

          "$BUILD_TOOLS/apksigner" print-certs "$APK" > certs.txt 2>&1 || true
          grep -i "SHA-256" certs.txt | sed 's/^/  /'

          # A release that is not signed cannot be installed, so the build stops
          # here rather than publish something unusable.
          "$BUILD_TOOLS/apksigner" verify "$APK"
          "$BUILD_TOOLS/zipalign" -c 4 "$APK"

          # A valid signature is not the same as *our* signature.
          #
          # `apksigner verify` answers "is this signed and intact", which a brand
          # new keystore answers just as well as the real one. Android identifies
          # an app by its signing certificate, so an APK signed with a different
          # key installs beside the old one instead of over it, or refuses to
          # install at all — and by then the version number has been spent and the
          # release is published. The fingerprint lives in a repository variable
          # rather than a secret because a certificate is public: it proves who
          # signed this, which is exactly what it is for.
          #
          # Rotating the key means changing this variable in the same breath,
          # which is the deliberate step rotation is supposed to be.
          if [ -z "${EXPECTED_CERT:-}" ]; then
            echo "::error::EXPECTED_CERT is not set, so the APK's signer cannot be checked."
            echo "Set the repository variable EXPECTED_CERT to the certificate's SHA-256 fingerprint."
            exit 1
          fi
          # The line reads `Signer #1 certificate SHA-256 digest: ab:cd:...` — the
          # digest carries its own colons, so it cannot be split on one. Stripping
          # every space and colon leaves the 64 hex characters of the digest at the
          # end of the line, which is unambiguous.
          signer="$(grep -i "SHA-256" certs.txt | head -1 | tr -d ' :' \
            | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{64}$')"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d ' :' | tr 'A-F' 'a-f')"
          if ! printf '%s' "$signer" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Could not read the signer's fingerprint from apksigner (got '$signer')."
            cat certs.txt
            exit 1
          fi
          if [ "$signer" != "$expected" ]; then
            echo "::error::The APK is signed by $signer, not by $expected."
            echo "Either the key changed, or this is not our build. Neither ships."
            exit 1
          fi
          echo "signed by the expected certificate"

      # The bundle the run exists to make: the APK, the list of what changed,
      # and the tour pictures that show the features work. Together they answer
      # "what am I looking at, and does it do what was promised" without
      # anybody reading a log.
      # The APK and the version go to the job that assembles the bundle. This job
      # does not wait for the tests: the bundle is assembled once both are done.
      - name: Hand the APK onward
        if: steps.decision.outputs.changed == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
  # -------------------------------------------------------------------------
  # Delivery: what the run has to hand over, made once.
  #
  # This used to be two jobs — one assembling a bundle and putting it on the run
  # as an artifact, then another taking that artifact back down and publishing it.
  # The second job's first act was to download what the first had just uploaded,
  # which cost a nine megabyte round trip on every run to move a file between two
  # machines that never needed to be two machines. Measured, that was 8-10s.
  #
  # It is one job now. It waits for the tests and the build, so a red suite still
  # delivers nothing, and it publishes only on main.
  # -------------------------------------------------------------------------
  deliver:
    name: Deliver
    needs: [test, build-release, lint]
    # The condition has to say everything now, because `!cancelled()` replaces the
    # implicit rule. A job whose `needs` include a *skipped* job is skipped too,
    # and lint is skipped on development — so writing only "is this a build and
    # did the app change" silently stopped development from ever handing over an
    # APK the moment lint stopped running there. Every answer the implicit rule
    # used to give is now written out: the suite passed, the build succeeded, and
    # lint either passed or did not run.
    if: |
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.build-release.outputs.changed != 'no'
      && needs.test.result == 'success'
      && needs.build-release.result == 'success'
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Write is granted even on a development push, where nothing is published,
    # because permissions cannot be conditional. What keeps a development push
    # from releasing is the `if:` on the publish steps below, and the fact that
    # they are the only thing here that writes.
    permissions:
      contents: write
      # The attestation signs the provenance of the APK, and signing is what needs
      # to be able to prove who this job is.
      id-token: write
      attestations: write
      # Reading the branch head is what the publish guard needs to know whether
      # this run has been overtaken.
      actions: read

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits, because "what changed" is asked of this commit against
          # the one before it.
          fetch-depth: 2
          persist-credentials: false

      - name: Take the APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: apk

      - name: Take the scenarios
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scenarios
          path: scenarios

      - name: Write down what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash tools/changes.sh > changes.md
          cat changes.md

      - name: Put the bundle together
        run: |
          mkdir -p bundle
          cp apk/app-release.apk bundle/
          cp changes.md bundle/
          # The scenarios keep their folders: the report refers to the pictures
          # beside it, so flattening them would break every link.
          cp -r scenarios bundle/scenarios
          # One report, assembled from the scenarios that were actually drawn.
          # It is written for a person: no classes, no timings, no stack traces.
          bash tools/scenario-report.sh bundle/scenarios \
            --out bundle/scenarios/README.md
          ls -la bundle/

      # Only a development push needs this artifact: main publishes a release,
      # and the release is the delivery. Uploading it there as well would be nine
      # megabytes of storage and a couple of seconds spent on a copy nobody opens.
      - name: Hand the bundle to the run, for a build with no release
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-bundle
          path: |
            bundle/app-release.apk
            bundle/changes.md
            bundle/scenarios/**
          # Seven days: this is the thing a development push is for, and a week
          # is long enough to install and look at it.
          retention-days: 7
          if-no-files-found: error

      # Before anything is published, say where the file came from. The
      # attestation binds the APK to this commit and this workflow run in a way
      # anybody can check afterwards, which is the difference between "a file
      # called app-release.apk" and "the APK built from this commit". It is free
      # for a public repository.
      - name: Attest that this APK came from this commit
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: bundle/app-release.apk

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION_NAME: ${{ needs.build-release.outputs.version_name }}
        run: |
          # A run that was overtaken while it was assembling must never publish:
          # a newer push has cancelled it, but it could have got this far before
          # the cancellation arrived. Publishing a commit that is no longer the
          # head of main would put an old build behind the newest version number.
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ -n "${GITHUB_SHA:-}" ]; then
            head="$(gh api "repos/${REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null)"
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
              echo "This run was overtaken by a newer commit; nothing is published."
              exit 0
            fi
          fi

          # The release is the last thing that happens, so a failure earlier
          # leaves nothing half-published. A release that already exists is not a
          # failure: a re-run of the same commit must be allowed to do nothing.
          # Anything else is a failure and is reported as one, because a green run
          # that published nothing is the one outcome that must never happen
          # quietly.
          # A release that already exists is only "nothing to do" if it is this
          # release. Asking whether the tag exists answers the wrong question: a
          # tag created by hand, a partial upload, or a previous run that died
          # mid-upload all leave a release behind, and exiting quietly would report
          # success for a version that is not the one this commit built.
          if existing="$(gh release view "v${VERSION_NAME}" --repo "$REPOSITORY" \
              --json targetCommitish,assets 2>/dev/null)"; then
            target="$(printf '%s' "$existing" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("targetCommitish") or "")')"
            has_apk="$(printf '%s' "$existing" | python3 -c 'import json,sys;print("yes" if any(a["name"]=="app-release.apk" for a in json.load(sys.stdin)["assets"]) else "no")')"
            if [ "$target" = "$GITHUB_SHA" ] && [ "$has_apk" = "yes" ]; then
              echo "Version ${VERSION_NAME} is already published from this commit; nothing to do."
              exit 0
            fi
            echo "::error::v${VERSION_NAME} already exists but is not this release:"
            echo "  tag points at '${target:-unknown}', this run built $GITHUB_SHA, APK present: $has_apk"
            echo "A half-published release cannot be repaired by re-running, and it must not be"
            echo "reported as success. Delete the release and tag, then run again."
            exit 1
          fi

          # The report points at the pictures beside it, and a release cannot hold
          # folders, so each picture becomes a flat asset whose name still says
          # which scenario and which half of it. The report's links are aimed at
          # those names, and each scenario's own page travels the same way.
          BASE_URL="https://github.com/${REPOSITORY}/releases/download/v${VERSION_NAME}"
          assets=()
          mkdir -p report
          cp bundle/scenarios/README.md report/scenarios.md
          for picture in bundle/scenarios/*/*.png; do
            [ -e "$picture" ] || continue
            scenario="$(basename "$(dirname "$picture")")"
            half="$(basename "$picture")"
            name="scenario-${scenario}-${half}"
            cp "$picture" "$name"
            assets+=("$name")
          done
          for page in bundle/scenarios/*/README.md; do
            [ -e "$page" ] || continue
            scenario="$(basename "$(dirname "$page")")"
            name="scenario-${scenario}-page.md"
            cp "$page" "report/$name"
            assets+=("report/$name")
          done

          # The report is rewritten to point at those assets, then appended to the
          # body: a release page that lists the changes and then shows the app
          # working, in the words of somebody describing it to a person.
          sed -E \
            -e "s#\]\(([^/)]+)/(before|after)\.png\)#](${BASE_URL}/scenario-\1-\2.png)#g" \
            -e "s#\*\*\[([^]]+)\]\([0-9][^)]*/README\.md\)\*\*#\1#g" \
            -e "s#\[([^]]+)\]\([0-9][^)]*/README\.md\)#**\1**#g" \
            bundle/scenarios/README.md > report/scenarios.md

          cp bundle/changes.md release-notes.md
          {
            printf '\n\n---\n\n'
            cat report/scenarios.md
          } >> release-notes.md

          # `--target` is not decoration. Without it the tag is created from
          # whatever the branch points at when the command runs, which is not
          # necessarily the commit this APK was built from — the head check above
          # narrows that window but cannot close it, because the check and the
          # create are two operations and a push can land between them. Naming the
          # commit makes the tag, the APK and the attestation the same source.
          gh release create "v${VERSION_NAME}" \
            --repo "$REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Muffy Codes ${VERSION_NAME}" \
            --notes-file release-notes.md \
            bundle/app-release.apk \
            "${assets[@]}" \
            report/scenarios.md

          # Publishing is several operations against something that cannot be
          # undone, and a failure halfway leaves a release that looks published
          # and is not. So the result is read back rather than assumed: the tag
          # must point at this commit, the APK must be there with the digest of
          # the file that was attested, and every scenario picture the report
          # links to must exist as an asset.
          #
          # This is the check that would have caught a cancelled run leaving a
          # partial release — and the reason the check above refuses to call an
          # existing release "already done" on the strength of its name.
          # Proving it is what it claims is a script rather than a heredoc here:
          # a heredoc inside a `run: |` block cannot be indented, and the YAML
          # parser reads unindented lines as structure. The script is also the
          # part worth reading on its own, and it can be run by hand against a
          # release that looks wrong.
          python3 tools/check-release.py \
            --version "$VERSION_NAME" \
            --repo "$REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --apk bundle/app-release.apk \
            --report bundle/scenarios/README.md

          echo "### Published v${VERSION_NAME} from ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified: tag on this commit, APK digest matches, every linked picture attached." >> "$GITHUB_STEP_SUMMARY"
