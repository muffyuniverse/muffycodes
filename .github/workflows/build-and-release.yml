name: Build and release

# Three levels of cost, one for each thing a branch is for.
#
# A pull request runs the tests and nothing else: the tests are what answer
# whether a change is good, and that answer is the only one needed before a
# merge. No lint, no release build.
#
# A push to development adds the release build and keeps the APK as an artifact,
# so there is something to install and look at. It does not publish a release
# and it does not run the deep checks.
#
# A push to main is the only thing that publishes: it runs everything, including
# the deep checks, and a release that fails them is never published.
#
# On main the release is built *at the same time* as the tests rather than after
# them. It cannot be published until the tests pass, so the ordering is kept
# where it matters, and about twenty seconds are saved by not waiting for one to
# finish before starting the other.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "The version of the release (for example 1.4)"
        required: true
        type: string

# A second push makes the first run pointless, so the first one is stopped
# immediately, on a branch and on main alike: a run that nobody will read is the
# most expensive thing a run can do, and pushing twice in a minute should not
# cost two full pipelines.
#
# Cancelling a release is safe because the version is worked out from the last
# published release rather than counted, so a skipped run leaves no gap. It is
# made safer by a check before publishing: the job that publishes verifies the
# commit it is publishing is still the head of main, so a run that was
# overtaken while it was assembling can never publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The tests only read the repository. Writing is granted to the one job that
# publishes a release, so a mistake elsewhere cannot change anything on GitHub.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# The settings every job shares. They are written once here and used through
# `uses: ./.github/actions/setup` style repetition is avoided: each job simply
# repeats these three steps, which is cheaper than the indirection and makes
# each job readable on its own.
# ---------------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------------
  # The tests. The only job a pull request runs.
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # How many runners share the suite, set by the repository variable
    # TEST_SHARDS, which holds a list of shard indexes. Unset means `[0]`: one
    # runner, the whole suite, which is right while the suite takes six seconds.
    #
    # When it stops being right, the variable becomes `[0,1]` and then `[0,1,2,3]`
    # and nothing else changes: no workflow edit, no rearrangement of tests. The
    # split is by shard index and never by what changed, so each shard keeps the
    # same command line from run to run and its configuration-cache entry stays
    # useful.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.TEST_SHARDS || '[0]') }}

    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Only the commit being built is needed. A full history would be
          # fetched for nothing, and the repository is not asked to care about
          # its past to decide whether this commit works.
          fetch-depth: 1
          persist-credentials: false

      # This is deliberately the first thing that happens, before Java and
      # Gradle are set up. Deciding costs a second and needs nothing but git and
      # a shell; provisioning costs fifteen. Asking the cheap question first is
      # what lets a change that cannot affect the app finish in seconds instead
      # of paying for a toolchain it will not use.
      #
      # A pull request runs only the tests its own change can have broken; main
      # runs all of them, because main is what ships. That is the difference
      # between a quick answer on a change and a real answer on a release.
      #
      # The selector falls back to everything whenever it cannot tell: a changed
      # file that is on no line of tools/test-map.txt, a change to the build
      # itself, or an empty change. Unknown means full, never nothing.
      - name: Work out which tests this change needs
        id: which
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          TOOLS_DIR: ${{ github.workspace }}/tools
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "This is not a pull request, so every test runs."
            selection="$(bash "$TOOLS_DIR/changed-tests.sh" --all)"
          else
            # The changes are measured against the branch the pull request is
            # for, which is fetched because a shallow checkout has only one
            # commit of it and no merge base to compare with.
            git fetch --quiet --no-tags --depth=50 origin "$BASE_REF" || true
            selection="$(bash "$TOOLS_DIR/changed-tests.sh" --base "origin/$BASE_REF")"
          fi

          echo "the tests this change touches: $selection"

          # A list of classes is reported but not used to narrow the run, and the
          # reason is measured. The whole suite takes 6.3 seconds on the
          # integration machine, while asking Gradle for a subset changes the
          # command line, and a changed command line is a different
          # configuration-cache entry: the run would trade a six second saving
          # for a fifteen second miss. Every test runs instead, which is also
          # the stronger answer.
          case "$selection" in
            NONE) echo "verdict=NONE" >> "$GITHUB_OUTPUT" ;;
            *)    echo "verdict=ALL"  >> "$GITHUB_OUTPUT" ;;
          esac

      # Everything below is provisioning, and all of it is skipped when there is
      # nothing to run: a job that installs a toolchain to do no work is a job
      # that spends a minute to say nothing.
      - name: Set up Java
        if: steps.which.outputs.verdict != 'NONE'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # The action keeps Gradle's home, the downloaded dependencies and the
      # build cache between runs. Everything below is about not paying twice for
      # the same thing.
      #
      # `cache-cleanup: never` is the single largest saving in this file: the
      # action's post step otherwise starts a second Gradle (the runner's own,
      # a different version from ours) in a fresh daemon just to tidy the cache,
      # which measured twenty-eight seconds — more than the tests themselves.
      # The price is that entries are never pruned; this project is small, and
      # the enhanced provider the action uses by default deduplicates them.
      #
      # A pull request only reads the cache. It has nothing worth saving that
      # main will not save a moment later, and a write-only run is a run whose
      # post step is wasted work.
      - name: Set up Gradle
        if: steps.which.outputs.verdict != 'NONE'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: never
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Say what this machine has
        if: steps.which.outputs.verdict != 'NONE'
        run: |
          echo "processors: $(nproc)"
          awk '/MemTotal/ {printf "memory: %.1f GB\n", $2/1024/1024}' /proc/meminfo

      # Robolectric downloads the Android runtime it runs against (a jar of well
      # over a hundred megabytes) the first time it needs it, and would
      # otherwise do that again on every run. It keeps them in the local Maven
      # repository, so that directory is what is kept between runs.
      #
      # The key is a fixed name and not a hash of the build file. Hashing the
      # build file looked careful and was worse than useless: every edit to it
      # produced a new key, which means a cache that is never found and a
      # runtime that is downloaded again. What decides which runtime is needed
      # is the version of Robolectric, which changes rarely, so the key is a
      # version raised by hand when that line in build.gradle.kts changes.
      # Caches cannot be overwritten, so raising this number retires a stale one.
      #
      # This one cache was worth about a minute per run on its own.
      - name: Remember the runtime the tests need
        if: steps.which.outputs.verdict != 'NONE'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: robolectric-runtime-v1-${{ runner.os }}

      # Deliberately NOT split into shards. Measured on a 58-test suite: the
      # tests take 16s while setting a job up costs 17s, so two shards would each
      # pay the setup in full to halve a little work — slower in wall clock and
      # twice the runners. Sharding pays when the work dwarfs the setup; worth
      # revisiting if the suite ever passes about two minutes.
      #
      # The release lint runs here rather than in the release build, and that is
      # the single biggest remaining saving. Measured, it is seventeen seconds of
      # the release build's forty, and it is needed by `assembleRelease` only
      # because Android says so. This job finishes well before the release job
      # does, so the same check costs nothing here, and the release job skips it
      # (see there). It still gates the release, because publishing waits for
      # this job to pass.
      # Gradle's configuration cache lives in the project's own `.gradle`
      # directory, which a fresh checkout does not have, so it would be paid for
      # and thrown away on every run. Keeping it turns the configuration phase —
      # measured at fifteen seconds, the largest fixed cost in a run — into a
      # restore.
      #
      # The key is the build files and nothing else: the cache describes how the
      # project is put together, not what the sources say, so a change to a
      # Kotlin file reuses it. When the key does miss, Gradle recomputes and
      # stores a new entry; a miss costs what it costs today and never a wrong
      # build.
      - name: Remember how the project is put together
        if: steps.which.outputs.verdict != 'NONE'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle/configuration-cache
          key: config-cache-v1-tests-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            config-cache-v1-tests-${{ runner.os }}-
      - name: Run the tests
        # Nothing that could change the app was touched, so the app being tested
        # is byte for byte the one that already passed. Running a suite to
        # confirm that is a minute spent to learn nothing.
        if: steps.which.outputs.verdict != 'NONE'
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_OF: ${{ strategy.job-total }}
        run: |
          # `--parallel` does nothing with one module and costs nothing; it is
          # here so that the day the app is split into modules, the runners use
          # them without anybody remembering to add it.
          #
          # The shard arguments are word-split on purpose, and are empty when
          # there is one shard, so that the command line stays identical to an
          # unsharded run and keeps its cache.
          # shellcheck disable=SC2086
          ./gradlew --parallel --no-daemon --configuration-cache \
            testDebugUnitTest \
            $(bash tools/test-shard.sh --shard "$SHARD" --of "$SHARD_OF")

      # Kept only when something failed, because it is the only thing that
      # explains a failure: the report carries the per-class timings and the
      # stack traces. On a passing run the same lines are in the log, and the
      # upload costs six seconds to store twenty kilobytes.
      #
      # It also carries how long each test class took, which is the honest basis
      # for deciding whether splitting the suite would ever be worth its cost.
      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------------------
  # The release checks, on their own runner so that neither of the other two
  # jobs has to carry them.
  #
  # Android attaches lintVitalRelease to assembleRelease whether or not it is
  # asked for, and it is the single slowest check in the build. Run in the test
  # job it made that job the slowest of the three; run in the release job it
  # delayed the APK. On a runner of its own it costs nothing but a machine,
  # because the other two are busy at the same time.
  #
  # It is a gate all the same: publishing waits for this job, so a release that
  # would fail the check is never published.
  # -------------------------------------------------------------------------
  lint:
    name: Deep checks
    # Main only. Lint reads the whole project and costs sixty seconds doing it,
    # and a pull request cannot afford that as its longest job: it would be the
    # critical path, and the answer a pull request needs is about the tests.
    #
    # The price of moving it here is honest and worth stating: a lint failure is
    # now found after the merge, on the commit that reached main, rather than on
    # the pull request that caused it. It still cannot ship — publishing waits
    # for this job — so the failure is contained to main being red until it is
    # fixed, instead of a bad APK going out.
    #
    # It does not run on a development branch either: that branch exists to hand
    # a build to the person who will look at it, and the checks worth paying for
    # there are the tests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: never
          cache-read-only: true

      # Gradle's configuration cache lives in the project's own `.gradle`
      # directory, which a fresh checkout does not have, so it would be paid for
      # and thrown away on every run. Keeping it turns the configuration phase —
      # measured at fifteen seconds, the largest fixed cost in a run — into a
      # restore.
      #
      # The key is the build files and nothing else: the cache describes how the
      # project is put together, not what the sources say, so a change to a
      # Kotlin file reuses it. When the key does miss, Gradle recomputes and
      # stores a new entry; a miss costs what it costs today and never a wrong
      # build.
      - name: Remember how the project is put together
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gradle/configuration-cache
          key: config-cache-v1-lint-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            config-cache-v1-lint-${{ runner.os }}-

      - name: Check the release
        run: ./gradlew --parallel --no-daemon --configuration-cache lintVitalRelease

  # -------------------------------------------------------------------------
  # The release, built while the tests are still running. Only ever on main.
  # -------------------------------------------------------------------------
  build-release:
    name: Build the release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}

    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # Read-only here: this job builds and hands the APK on. Whatever is worth
      # remembering about the build has already been remembered by the test job,
      # so there is nothing to add and no reason to spend time writing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: never
          cache-read-only: true

      - name: Put the signing key in place
        env:
          MUFFY_KEYSTORE_BASE64: ${{ secrets.MUFFY_KEYSTORE_BASE64 }}
        run: |
          # The build reads the key from the environment, so nothing has to be
          # written to disk that is not needed.
          if [ -z "$MUFFY_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key found, the release will be unsigned."
          fi

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The values are handed to the script through the environment, so that
          # nothing a person typed is ever pasted into the script.
          EVENT_NAME: ${{ github.event_name }}
          CHOSEN_VERSION: ${{ inputs.version_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version_name="$CHOSEN_VERSION"
          else
            # The version is the number of the last release, plus one, so the
            # numbers only ever go up.
            last="$(gh release list --repo "$REPOSITORY" --limit 1 \
              --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')"
            version_name="$(( ${last:-0} + 1 ))"
          fi

          # The version code is what Android compares to decide whether an APK
          # is newer than the one installed, so it must be a number that only
          # goes up. It sits a thousand above the version, so it is always
          # bigger than any release made by hand before.
          if ! printf '%s' "$version_name" | grep -qE '^[0-9]+$'; then
            last="$(gh release list --repo "$REPOSITORY" --limit 1 \
              --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')"
            version_name="$(( ${last:-0} + 1 ))"
          fi
          version_code="$(( version_name + 1000 ))"

          echo "name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "The version is ${version_name} (code ${version_code})."

      # `-x lintVitalRelease` is not a check being dropped: Android attaches it
      # to `assembleRelease`, and it is the same analysis the test job already
      # runs on its own runner. Running it twice would add a minute here and
      # change nothing, because the release is not published unless that job
      # passed first.
      - name: Build the release
        env:
          MUFFY_KEYSTORE_BASE64: ${{ secrets.MUFFY_KEYSTORE_BASE64 }}
          MUFFY_KEYSTORE_PASSWORD: ${{ secrets.MUFFY_KEYSTORE_PASSWORD }}
          MUFFY_KEY_ALIAS: ${{ secrets.MUFFY_KEY_ALIAS }}
          MUFFY_KEY_PASSWORD: ${{ secrets.MUFFY_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # No --configuration-cache here, deliberately: this invocation carries
          # a version code and name that differ on every release, so the entry
          # could never be reused and storing it would be a cost with no payoff.
          ./gradlew --parallel --no-daemon assembleRelease \
            -x lintVitalRelease \
            -Pmuffy.versionCode="$VERSION_CODE" \
            -Pmuffy.versionName="$VERSION_NAME"

      - name: Check the signature of the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk

          # The version of the build tools is not written down here. It was, and
          # that is the kind of thing that breaks a year later without warning:
          # the runner image decides which versions exist, and it changes. The
          # newest one present is used instead, which is safe because these two
          # tools read anything they are given, however old.
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          BUILD_TOOLS="${BUILD_TOOLS%/}"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::No Android build tools found under $ANDROID_HOME"
            exit 1
          fi
          echo "checking with $(basename "$BUILD_TOOLS")"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # A release that is not signed cannot be installed, so the build stops
          # here rather than publish something unusable.
          "$BUILD_TOOLS/apksigner" verify "$APK"
          "$BUILD_TOOLS/zipalign" -c 4 "$APK"

      # The APK is a single artefact of about eight megabytes, so this is a
      # hand-over between jobs and not a bottleneck: it is stored once and
      # downloaded once, by the job that publishes it.
      - name: Hand the APK to the job that publishes it
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          # It is needed by the very next job, so it is kept for a day rather
          # than for the thirty that a downloadable build does not need.
          retention-days: 1
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Publishing, which waits for both. This is where "only a tested release"
  # is enforced: nothing is published unless every test passed.
  # -------------------------------------------------------------------------
  publish:
    name: Publish
    # Only main releases, and only by hand or by a push to main. A development
    # push keeps its APK as an artifact of the run instead: something to install
    # and look at, not something to hand to anybody as a version.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test, build-release, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Reading the branch head is what the guard above needs to know whether
      # this run has been overtaken.
      actions: read

    steps:
      - name: Take the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION_NAME: ${{ needs.build-release.outputs.version_name }}
        run: |
          # A run that was overtaken while it was assembling must never publish:
          # a newer push has cancelled it, but it could have got this far before
          # the cancellation arrived. Publishing a commit that is no longer the
          # head of main would put an old build behind the newest version number.
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ -n "${GITHUB_SHA:-}" ]; then
            head="$(gh api "repos/${REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null)"
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
              echo "This run was overtaken by a newer commit; nothing is published."
              exit 0
            fi
          fi

          # The release is the last thing that happens, so a failure earlier
          # leaves nothing half-published. If it still cannot be made, the build
          # itself was good and only the publishing failed, which is said plainly.
          # A release that already exists is not a failure: a re-run of the same
          # commit must be allowed to do nothing. Anything else is a failure and
          # is reported as one, because a green run that published nothing is the
          # one outcome that must never happen quietly.
          if gh release view "v${VERSION_NAME}" --repo "$REPOSITORY" > /dev/null 2>&1; then
            echo "Version ${VERSION_NAME} is already released; nothing to publish."
            exit 0
          fi

          gh release create "v${VERSION_NAME}" \
            --repo "$REPOSITORY" \
            --title "Muffy Codes ${VERSION_NAME}" \
            --notes "Version ${VERSION_NAME} of Muffy Codes, built and tested by the workflow." \
            app-release.apk
