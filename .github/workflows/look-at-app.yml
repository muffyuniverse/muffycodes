name: Look at the app

# A short run that only looks at the app and writes down what is on the
# screen. It is used to write the steps of the tour with the real names.
#
# It is started by hand, and it is not part of the normal build.

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "The Android version to use"
        required: false
        default: "34"
        # A list rather than a free-text box: this value goes into a command the
        # emulator action runs, so it must only ever be able to be one of these.
        type: choice
        options:
          - "26"
          - "28"
          - "30"
          - "33"
          - "34"
          - "35"

permissions:
  contents: read

jobs:
  look:
    name: Look at the app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Said on the job as well as on the workflow, so that a job never has more
    # than it needs because a wider rule happened to be in scope.
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Let the emulator use the processor
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app
        run: |
          ./gradlew --no-daemon assembleDebug \
            -Pmuffy.versionName="look" \
            -Pmuffy.versionCode=1

      - name: Look at the app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ADB: adb
          SKIP_LAUNCH: "1"
          SHOT_DIR: ${{ github.workspace }}/screenshots
          TOUR_FILE: ${{ github.workspace }}/tools/look-tour.txt
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.example.notes/com.example.notes.MainActivity
            sleep 8
            bash tools/screenshot-tour.sh

      - name: Put the names in the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-names
          retention-days: 7
          path: |
            screenshots/*.txt
          if-no-files-found: warn
