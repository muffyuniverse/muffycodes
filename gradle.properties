org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Run the Kotlin compiler inside the Gradle process: a second daemon would not fit
# in this container's memory budget.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# This host is arm64, but the Android build-tools aapt2 binary is x86_64.
# The build needs a qemu-user wrapper around the real aapt2. That setting is
# machine-specific, so it lives in the Gradle user home (outside the
# repository) rather than here.
