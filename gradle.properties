# Project settings for Gradle.
#
# Nothing here is tuned for one particular machine. This file is read by every
# build, including the ones made by hand in a small container and the ones made
# by the continuous integration on a machine with several processors, so it
# says what is true of the project rather than what is true of a host.
#
# Settings that belong to a host (how much memory it has, where its tools are)
# live in that host's own Gradle home, out of the repository. A build then gets
# whatever its machine can actually give it: a machine with eight processors
# uses all eight, and a small one is left alone by nothing in this file.

# AGP 9 merges more, larger libraries than before — Compose 2026 and core-ktx
# 1.19 among them — and its dexer ran out of heap at the default size, which
# cost a release build. A GitHub runner has sixteen gigabytes; four for the JVM
# leaves plenty for the workers, and turns a flaky out-of-memory into a build
# that simply works.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false

# The configuration of the build is remembered between runs, so a run that
# changes nothing but a test does not have to work it all out again.
org.gradle.configuration-cache=true

# A problem in the configuration cache must fail the build, and the reason is
# worth writing down because it cost a broken release check to learn.
#
# With `warn`, a task that cannot be cached is stored "best-effort" anyway, and
# the entry is only thrown away at the end of the build if the task declared
# itself incompatible. So a task that caches fine but crashes when the entry is
# read back — which is exactly what Android Lint does, its UAST state does not
# survive being restored — gets a cache entry that passes every check and then
# breaks on the next run. `warn` turns "this cannot be cached" into a trap that
# springs later.
#
# `fail` means the cache is either trustworthy or absent. Nothing is silently
# remembered that might not survive being remembered.
org.gradle.configuration-cache.problems=fail

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Incremental compilation: a change to one file recompiles that file and what
# depends on it, not the whole project.
kotlin.incremental=true
