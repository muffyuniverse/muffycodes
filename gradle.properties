# Project settings for Gradle.
#
# Nothing here is tuned for one particular machine. This file is read by every
# build, including the ones made by hand in a small container and the ones made
# by the continuous integration on a machine with several processors, so it
# says what is true of the project rather than what is true of a host.
#
# Settings that belong to a host (how much memory it has, where its tools are)
# live in that host's own Gradle home, out of the repository. A build then gets
# whatever its machine can actually give it: a machine with eight processors
# uses all eight, and a small one is left alone by nothing in this file.

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false

# The configuration of the build is remembered between runs, so a run that
# changes nothing but a test does not have to work it all out again.
org.gradle.configuration-cache=true
# The configuration cache is a cache, so a problem in it must never be
# mistaken for a problem in the code: it is a warning and the build goes on.
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Incremental compilation: a change to one file recompiles that file and what
# depends on it, not the whole project.
kotlin.incremental=true
